services:
   web:
      build: .  
      environment:
        - ALLOW_OVERRIDE=true
      ports:
        - "81:80"
      links:
        - db
      volumes:
        - ./app:/var/www/html/

   db:
     image: mariadb:10.8.2
     container_name: database
     restart: always
     volumes:
       - db_data:/var/lib/mysql
       - ./database.sql:/docker-entrypoint-initdb.d/01-init.sql
     environment:
       MYSQL_ROOT_PASSWORD: root
       MYSQL_USER: admin
       MYSQL_PASSWORD: test
       MYSQL_DATABASE: database
     ports:
       - "3306:3306"

   phpmyadmin:
     image: phpmyadmin/phpmyadmin:latest
     links:
       - db
     ports:
       - "8890:80"
     environment:
       PMA_HOST: db
       MYSQL_USER: admin
       MYSQL_PASSWORD: test

volumes:
  db_data: 
